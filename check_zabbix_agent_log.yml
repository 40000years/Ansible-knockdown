---
- name: "Test Zabbix Agent config"
  hosts: all
  become: yes
  gather_facts: false
  tasks:
    - name: "Get Zabbix Agent service status"
      shell: "systemctl status zabbix-agent2.service"
      register: agent_status
      ignore_errors: true

    - name: "Get Zabbix Agent log"
      shell: "tail -n 30 /var/log/zabbix/zabbix_agent2.log"
      register: agent_log
      ignore_errors: true

    - name: "Show status and log"
      debug:
        msg: 
          - "--- SERVICE STATUS ---"
          - "{{ agent_status.stdout }}"
          - "{{ agent_status.stderr }}"
          - "--- AGENT LOG ---"
          - "{{ agent_log.stdout }}"
