---
- name: "Test Zabbix Agent config syntax"
  hosts: all
  become: yes
  gather_facts: false
  tasks:
    - name: "Test config syntax with capital T"
      shell: "zabbix_agent2 -T -c /etc/zabbix/zabbix_agent2.conf"
      register: config_test
      ignore_errors: true

    - name: "Show exact syntax error"
      debug:
        msg: 
          - "--- CONFIG TEST OUTPUT ---"
          - "{{ config_test.stdout }}"
          - "{{ config_test.stderr }}"
