---
- name: "Test Zabbix Agent config"
  hosts: all
  become: yes
  gather_facts: false
  tasks:
    - name: "Test config"
      shell: "zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf -t"
      register: config_test
      ignore_errors: true

    - name: "Show config error"
      debug:
        msg: "{{ config_test.stderr }}"

    - name: "Show config output"
      debug:
        msg: "{{ config_test.stdout_lines[:5] }}"
