---
# ==============================================================
# K3s + Prometheus + Grafana Monitoring Playbook (Mac Master + AWS Workers)
#
# ใช้แทน setup_k3s_prometheus_grafana.yml
#
# Architecture:
#   - K3s Server (Master)          : Mac Local
#   - K3s Agent (Workers)          : AWS EC2 Instances
#   - Prometheus + Grafana (Helm)  : รันบน Mac K3s Master
#
# วิธีใช้งานใน Semaphore:
#   ⚠️ เนื่องจาก playbook นี้ต้องใช้ 2 inventory
#     แนะนำให้แยกรันเป็น task:
#     Task 1: setup_k3s_mac_master.yml          (inventory.local_mac.yml)
#     Task 2: join_k3s_aws_workers.yml          (inventory.aws_ec2.yml)
#     Task 3: deploy_prometheus_grafana_mac.yml (inventory.local_mac.yml)
#
#   Extra Variables:
#     mac_master_ip: "<IP-ที่-AWS-เข้าถึงได้>"
# ==============================================================

# ==============================================================
# PLAY 1: ติดตั้ง K3s บน Mac Master
# ==============================================================
- name: "Play 1: Install K3s Server (Mac Master)"
  hosts: mac-master
  become: no
  gather_facts: true
  vars:
    mac_master_ip: "CHANGE_ME"

  tasks:
    - name: "Check if k3s is already installed"
      stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: "Install K3s Server binary"
      shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_SKIP_ENABLE=true \
          INSTALL_K3S_SKIP_START=true \
          sh -
      when: not k3s_binary.stat.exists
      args:
        executable: /bin/bash

    - name: "Ensure K3s Server process is running"
      shell: |
        if ! pgrep -f '[k]3s server' > /dev/null; then
          nohup k3s server \
            --disable traefik \
            --write-kubeconfig-mode 644 \
            --tls-san {{ mac_master_ip }} \
            --tls-san 127.0.0.1 \
            --node-name mac-master \
            > /tmp/k3s.log 2>&1 &
          sleep 5
        fi
      args:
        executable: /bin/bash

    - name: "Wait for K3s to be ready"
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 120

    - name: "Read K3s node-token"
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_raw

    - name: "Set k3s_token fact for workers to use"
      set_fact:
        k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"
        k3s_master_ip: "{{ mac_master_ip }}"

# ==============================================================
# PLAY 2: Join AWS Workers (ต้องใช้ combined inventory)
# ==============================================================
- name: "Play 2: Join K3s Agent (AWS Workers)"
  hosts: "all:!mac-master"
  become: yes
  gather_facts: true
  vars:
    mac_master_ip: "CHANGE_ME"

  tasks:
    - name: "Check if k3s agent is already installed"
      stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: "Join K3s Cluster as Agent"
      shell: |
        curl -sfL https://get.k3s.io | \
          K3S_URL="https://{{ hostvars['mac-master']['k3s_master_ip'] }}:6443" \
          K3S_TOKEN="{{ hostvars['mac-master']['k3s_token'] }}" \
          INSTALL_K3S_EXEC="agent --node-name $(hostname -s)" \
          sh -
      when: not k3s_binary.stat.exists
      args:
        executable: /bin/bash

# ==============================================================
# PLAY 3: Deploy Prometheus + Grafana บน Mac Master (via Helm)
# ==============================================================
- name: "Play 3: Deploy Prometheus + Grafana Monitoring Stack"
  hosts: mac-master
  become: no
  gather_facts: true
  vars:
    mac_master_ip: "CHANGE_ME"
    grafana_admin_password: "Admin@Monitor123"
    grafana_nodeport: 32000
    prometheus_nodeport: 32001

  tasks:
    - name: "Install Helm"
      shell: |
        if ! command -v helm &>/dev/null; then
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        fi
      args:
        executable: /bin/bash

    - name: "Add Prometheus Helm repo"
      shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo update
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: "Wait for all K3s nodes to be Ready"
      shell: |
        kubectl wait --for=condition=Ready nodes --all --timeout=180s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      retries: 5
      delay: 30
      register: nodes_ready
      until: nodes_ready.rc == 0

    - name: "Deploy kube-prometheus-stack (Prometheus + Grafana + Alertmanager)"
      shell: |
        helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
          --namespace monitoring \
          --create-namespace \
          --set grafana.adminPassword="{{ grafana_admin_password }}" \
          --set grafana.service.type=NodePort \
          --set grafana.service.nodePort={{ grafana_nodeport }} \
          --set prometheus.service.type=NodePort \
          --set prometheus.service.nodePort={{ prometheus_nodeport }} \
          --set prometheus.prometheusSpec.scrapeInterval=15s \
          --set prometheus.prometheusSpec.evaluationInterval=15s \
          --wait \
          --timeout 10m
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      args:
        executable: /bin/bash

    - name: "Wait for Grafana pod to be Running"
      shell: |
        kubectl wait --for=condition=Ready pod \
          -l app.kubernetes.io/name=grafana \
          -n monitoring \
          --timeout=300s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      retries: 5
      delay: 20
      register: grafana_ready
      until: grafana_ready.rc == 0

    - name: "Show Monitoring Endpoints"
      debug:
        msg:
          - "============================================"
          - "  Monitoring Stack is LIVE on Mac!"
          - "============================================"
          - "  Grafana   : http://localhost:{{ grafana_nodeport }}"
          - "  Prometheus: http://localhost:{{ prometheus_nodeport }}"
          - "  Username  : admin"
          - "  Password  : {{ grafana_admin_password }}"
          - "============================================"
          - "  ไม่ต้อง SSH Tunnel — เข้าถึงได้ทันทีจาก Mac"
          - "============================================"
          - "  Pre-built dashboards:"
          - "  - Node Exporter Full (ID: 1860)"
          - "  - K3s Cluster (ID: 13770)"
          - "============================================"
