---
# ==============================================================
# PHASE 1: ติดตั้ง K3s Server บน Mac Local (Master Node via Docker)
#
# ใช้แทน setup_k3s_azure_master.yml
#
# วิธีใช้ใน Semaphore:
#   - Inventory : inventory.local_mac.yml
#   - Playbook  : setup_k3s_mac_master.yml
#   - Extra Variables:
#       mac_master_ip: "<IP-ที่-AWS-เข้าถึงได้>"  (เช่น Tailscale IP)
#
# หลังรันเสร็จ ให้ก๊อปปี้ค่า k3s_token ที่ขึ้นใน Output
# แล้วนำไปใส่ใน Phase 2 (Extra Variables)
# ==============================================================

- name: "Phase 1: Install K3s Master on Mac Local"
  hosts: mac-master
  become: no
  gather_facts: true
  vars:
    # IP ที่ AWS EC2 สามารถเข้าถึง Mac ได้ (เช่น Tailscale IP, ngrok, หรือ Public IP)
    mac_master_ip: "CHANGE_ME"

  tasks:
    - name: "Check if Docker is running"
      shell: "docker info > /dev/null 2>&1"
      register: docker_running
      ignore_errors: true
      changed_when: false

    - name: "Fail if Docker is not running"
      fail:
        msg: "❌ ไม่พบคำสั่ง docker หรือ Docker Daemon ไม่ได้เชื่อมต่อ! กรุณา rebuild Semaphore container โดยรัน 'cd Semaphore && docker compose up -d --build' และเปิด Docker Desktop"
      when: docker_running.rc != 0

    - name: "Check if K3s container is already running"
      shell: "docker inspect -f '{{.State.Running}}' k3s-server 2>/dev/null || echo 'false'"
      register: k3s_container_status
      changed_when: false

    - name: "Remove existing stopped K3s container (if any)"
      shell: "docker rm -f k3s-server 2>/dev/null || true"
      when: k3s_container_status.stdout != "true"
      changed_when: false

    - name: "Start K3s Server Docker container"
      shell: |
        docker run -d \
          --name k3s-server \
          --privileged \
          --restart unless-stopped \
          -p 6443:6443 \
          -p 32000:32000 \
          -p 32001:32001 \
          -p 32090:32090 \
          -v k3s-server-data:/var/lib/rancher/k3s \
          rancher/k3s:v1.30.2-k3s1 \
          server \
          --disable traefik \
          --write-kubeconfig-mode 644 \
          --tls-san {{ mac_master_ip }} \
          --tls-san 127.0.0.1 \
          --node-name mac-master
      when: k3s_container_status.stdout != "true"

    - name: "Wait for K3s node-token to be ready"
      shell: "docker exec k3s-server cat /var/lib/rancher/k3s/server/node-token"
      register: k3s_token_cmd
      until: k3s_token_cmd.rc == 0 and (k3s_token_cmd.stdout | trim != "")
      retries: 30
      delay: 3
      changed_when: false

    - name: "Export K3s Kubeconfig locally"
      shell: |
        mkdir -p /etc/rancher/k3s /tmp 2>/dev/null || true
        docker exec k3s-server cat /etc/rancher/k3s/k3s.yaml > /etc/rancher/k3s/k3s.yaml 2>/dev/null || \
        docker exec k3s-server cat /etc/rancher/k3s/k3s.yaml > /tmp/k3s.yaml
        chmod 644 /etc/rancher/k3s/k3s.yaml 2>/dev/null || chmod 644 /tmp/k3s.yaml
      changed_when: false

    - name: "Check K3s node status"
      shell: "docker exec k3s-server kubectl get nodes -o wide"
      register: nodes_output
      changed_when: false

    - name: "Show Phase 1 Results"
      debug:
        msg:
          - "============================================"
          - "  K3s Master is READY on Mac (Docker Container)!"
          - "============================================"
          - "  Master IP (for AWS)  : {{ mac_master_ip }}"
          - "  K3s API Endpoint     : https://{{ mac_master_ip }}:6443"
          - "============================================"
          - "  >>> COPY THIS TOKEN for Phase 2 <<<"
          - ""
          - "  {{ k3s_token_cmd.stdout | trim }}"
          - ""
          - "============================================"
          - "  Current Nodes:"
          - "{{ nodes_output.stdout }}"
          - "============================================"
          - "  NEXT STEP: Run 'join_k3s_aws_workers.yml'"
          - "  Extra Variables:"
          - "    k3s_master_ip: \"{{ mac_master_ip }}\""
          - "    k3s_token: \"<paste-token-here>\""
          - "============================================"
