---
# ==============================================================
# K3s + Zabbix Monitoring Playbook
# Architecture:
#   - Zabbix Server + Frontend: รันบน Master Node (ผ่าน Docker Compose)
#   - Zabbix Agent:             รันบนทุก Node (Master + Workers)
#
# วิธีใช้งานใน Semaphore:
#   Extra Variables:
#     k3s_master_id: "i-0xxxxxxxxxxxxxxxxx"  <- instance_id ของ Master
# ==============================================================

# ==============================================================
# PLAY 1: ติดตั้ง K3s Server บน Master Node
# ==============================================================
- name: "Play 1: Install K3s Server (Master Node)"
  hosts: "{{ k3s_master_id }}"
  become: yes
  gather_facts: true
  vars:
    k3s_master_id: "CHANGE_ME"

  tasks:
    - name: "Check if k3s is already installed"
      stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: "Install K3s Server"
      shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_EXEC="server \
            --disable traefik \
            --write-kubeconfig-mode 644 \
            --node-name $(hostname -s)" \
          sh -
      when: not k3s_binary.stat.exists
      args:
        executable: /bin/bash

    - name: "Wait for K3s node-token"
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 120

    - name: "Read K3s node-token"
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_raw

    - name: "Set k3s_token fact for workers to use"
      set_fact:
        k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"
        k3s_master_ip: "{{ ansible_default_ipv4.address }}"

# ==============================================================
# PLAY 2: ติดตั้ง K3s Agent บน Worker Nodes
# ==============================================================
- name: "Play 2: Join K3s Agent (Worker Nodes)"
  hosts: "all:!{{ k3s_master_id }}"
  become: yes
  gather_facts: true
  vars:
    k3s_master_id: "CHANGE_ME"

  tasks:
    - name: "Check if k3s agent is already installed"
      stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: "Join K3s Cluster as Agent"
      shell: |
        curl -sfL https://get.k3s.io | \
          K3S_URL="https://{{ hostvars[k3s_master_id]['k3s_master_ip'] if k3s_master_id in hostvars else k3s_master_ip }}:6443" \
          K3S_TOKEN="{{ hostvars[k3s_master_id]['k3s_token'] if k3s_master_id in hostvars else k3s_token }}" \
          INSTALL_K3S_EXEC="agent --node-name $(hostname -s)" \
          sh -
      when: not k3s_binary.stat.exists
      args:
        executable: /bin/bash

# ==============================================================
# PLAY 3: ติดตั้ง Zabbix Agent บนทุก Node
# ==============================================================
- name: "Play 3: Install Zabbix Agent on ALL Nodes"
  hosts: all
  become: yes
  gather_facts: true
  vars:
    k3s_master_id: "CHANGE_ME"
    zabbix_version: "7.0"

  tasks:
    # ---- Ubuntu ----
    - name: "Add Zabbix repo (Ubuntu)"
      shell: |
        if ! dpkg -l | grep -q zabbix-release; then
          wget -q https://repo.zabbix.com/zabbix/{{ zabbix_version }}/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_{{ zabbix_version }}+ubuntu$(lsb_release -rs)_all.deb -O /tmp/zabbix-release.deb
          dpkg -i /tmp/zabbix-release.deb
          apt-get update -qq
        fi
      args:
        executable: /bin/bash
      when: ansible_os_family == "Debian"

    - name: "Install Zabbix Agent 2 (Ubuntu)"
      apt:
        name: zabbix-agent2
        state: present
      when: ansible_os_family == "Debian"

    # ---- Amazon Linux / RedHat ----
    - name: "Add Zabbix repo (Amazon Linux)"
      shell: |
        if ! rpm -q zabbix-release &>/dev/null; then
          rpm -Uvh https://repo.zabbix.com/zabbix/{{ zabbix_version }}/rhel/9/x86_64/zabbix-release-latest.el9.noarch.rpm
          dnf makecache
        fi
      args:
        executable: /bin/bash
      when: ansible_os_family == "RedHat" or ansible_distribution == "Amazon"

    - name: "Install Zabbix Agent 2 (Amazon Linux)"
      dnf:
        name: zabbix-agent2
        state: present
      when: ansible_os_family == "RedHat" or ansible_distribution == "Amazon"

    - name: "Configure Zabbix Agent 2 to point to Zabbix Server"
      blockinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        block: |
          Server={{ hostvars[k3s_master_id]['k3s_master_ip'] if k3s_master_id in hostvars else k3s_master_ip }}
          ServerActive={{ hostvars[k3s_master_id]['k3s_master_ip'] if k3s_master_id in hostvars else k3s_master_ip }}
          Hostname={{ inventory_hostname }}
          HostMetadataItem=system.uname
          # Enable K3s/Docker monitoring plugins
          Plugins.Docker.Endpoint=unix:///var/run/docker.sock
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
      notify: Restart Zabbix Agent

    - name: "Enable and start Zabbix Agent 2"
      service:
        name: zabbix-agent2
        state: started
        enabled: yes

  handlers:
    - name: Restart Zabbix Agent
      service:
        name: zabbix-agent2
        state: restarted

# ==============================================================
# PLAY 4: ติดตั้ง Zabbix Server + Frontend บน Master Node
# ==============================================================
- name: "Play 4: Deploy Zabbix Server + Frontend on Master Node"
  hosts: "{{ k3s_master_id }}"
  become: yes
  gather_facts: true
  vars:
    k3s_master_id: "CHANGE_ME"
    zabbix_db_password: "Zabbix@Secure123"
    zabbix_web_port: 8088

  tasks:
    - name: "Ensure Docker and python3-pip are installed (Ubuntu)"
      apt:
        name:
          - docker.io
          - docker-compose-v2
          - python3-pip
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: "Ensure Docker is installed (Amazon Linux)"
      dnf:
        name:
          - docker
        state: present
      when: ansible_os_family == "RedHat" or ansible_distribution == "Amazon"

    - name: "Create Docker CLI plugins directory (Amazon Linux)"
      file:
        path: /usr/libexec/docker/cli-plugins
        state: directory
        mode: '0755'
      when: ansible_os_family == "RedHat" or ansible_distribution == "Amazon"

    - name: "Download docker-compose binary (Amazon Linux)"
      get_url:
        url: "https://github.com/docker/compose/releases/download/v2.28.1/docker-compose-linux-{{ ansible_architecture }}"
        dest: /usr/libexec/docker/cli-plugins/docker-compose
        mode: '0755'
      when: ansible_os_family == "RedHat" or ansible_distribution == "Amazon"

    - name: "Ensure Docker service is running"
      service:
        name: docker
        state: started
        enabled: yes

    - name: "Create Zabbix directory"
      file:
        path: /opt/zabbix
        state: directory
        mode: '0755'

    - name: "Create Zabbix Docker Compose file"
      copy:
        dest: /opt/zabbix/docker-compose.yml
        content: |
          version: '3.8'
          services:
            zabbix-db:
              image: mariadb:10.11
              container_name: zabbix-db
              restart: unless-stopped
              environment:
                MYSQL_ROOT_PASSWORD: "rootpass"
                MYSQL_DATABASE: "zabbix"
                MYSQL_USER: "zabbix"
                MYSQL_PASSWORD: "{{ zabbix_db_password }}"
              volumes:
                - zabbix-db-data:/var/lib/mysql
              mem_limit: 512m

            zabbix-server:
              image: zabbix/zabbix-server-mysql:ubuntu-latest
              container_name: zabbix-server
              restart: unless-stopped
              ports:
                - "10051:10051"
              environment:
                DB_SERVER_HOST: zabbix-db
                MYSQL_DATABASE: "zabbix"
                MYSQL_USER: "zabbix"
                MYSQL_PASSWORD: "{{ zabbix_db_password }}"
                ZBX_JAVAGATEWAY_ENABLE: "false"
              depends_on:
                - zabbix-db
              mem_limit: 512m

            zabbix-web:
              image: zabbix/zabbix-web-nginx-mysql:ubuntu-latest
              container_name: zabbix-web
              restart: unless-stopped
              ports:
                - "{{ zabbix_web_port }}:8080"
              environment:
                ZBX_SERVER_HOST: zabbix-server
                DB_SERVER_HOST: zabbix-db
                MYSQL_DATABASE: "zabbix"
                MYSQL_USER: "zabbix"
                MYSQL_PASSWORD: "{{ zabbix_db_password }}"
                PHP_TZ: "Asia/Bangkok"
              depends_on:
                - zabbix-server
              mem_limit: 256m

          volumes:
            zabbix-db-data:

    - name: "Start Zabbix Stack with Docker Compose"
      shell: |
        cd /opt/zabbix
        docker compose up -d
      args:
        executable: /bin/bash

    - name: "Wait for Zabbix Web to be responsive"
      wait_for:
        port: "{{ zabbix_web_port }}"
        host: "{{ ansible_default_ipv4.address }}"
        timeout: 300
        delay: 30

    - name: "Show Zabbix Access Information"
      debug:
        msg:
          - "============================================"
          - "  Zabbix Monitoring Stack is LIVE!"
          - "============================================"
          - "  Web UI : http://{{ ansible_default_ipv4.address }}:{{ zabbix_web_port }}"
          - "  Username: Admin"
          - "  Password: zabbix  (เปลี่ยนทันทีหลัง login)"
          - "============================================"
          - "  Agents registered from:"
          - "  Master : {{ hostvars[k3s_master_id]['k3s_master_ip'] }}"
          - "  - Workers: (ดูได้ใน Configuration > Hosts)"
          - "============================================"
          - "  Tips:"
          - "  - ไปที่ Configuration > Hosts เพื่อ Approve agents"
          - "  - ใช้ Template 'Linux by Zabbix agent' สำหรับ Node Monitoring"
          - "  - ใช้ Template 'Docker by Zabbix agent 2' สำหรับ Container"
          - "============================================"
