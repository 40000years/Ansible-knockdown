---
# ==============================================================
# Reconfigure Zabbix Agents บน AWS ให้ชี้หา Zabbix Server บน Mac
#
# วิธีใช้ใน Semaphore:
#   - Inventory : inventory.aws_ec2.yml
#   - SSH Key   : AWS Key
#   - Playbook  : reconfigure_zabbix_agents.yml
#   - Extra Variables:
#       zabbix_server_ip: "<Mac-IP-ที่-AWS-เข้าถึงได้>"
# ==============================================================

- name: "Reconfigure Zabbix Agents to point to Mac Zabbix Server"
  hosts: all
  become: yes
  gather_facts: true
  vars:
    zabbix_server_ip: "CHANGE_ME"  # ใส่ IP ของ Mac ที่ AWS เข้าถึงได้ (เช่น Tailscale IP)

  tasks:
    # ---- Ubuntu ----
    - name: "Add Zabbix repo (Ubuntu)"
      shell: |
        if ! dpkg -l | grep -q zabbix-release; then
          wget -q https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu$(lsb_release -rs)_all.deb -O /tmp/zabbix-release.deb
          dpkg -i /tmp/zabbix-release.deb
          apt-get update -qq
        fi
      args:
        executable: /bin/bash
      when: ansible_os_family == "Debian"

    - name: "Install Zabbix Agent 2 (Ubuntu)"
      apt:
        name: zabbix-agent2
        state: present
      when: ansible_os_family == "Debian"

    # ---- Amazon Linux / RedHat ----
    - name: "Add Zabbix repo (Amazon Linux)"
      shell: |
        if ! rpm -q zabbix-release &>/dev/null; then
          rpm -Uvh https://repo.zabbix.com/zabbix/7.0/rhel/9/x86_64/zabbix-release-latest.el9.noarch.rpm
          dnf makecache
        fi
      args:
        executable: /bin/bash
      when: ansible_os_family == "RedHat" or ansible_distribution == "Amazon"

    - name: "Install Zabbix Agent 2 (Amazon Linux)"
      dnf:
        name: zabbix-agent2
        state: present
      when: ansible_os_family == "RedHat" or ansible_distribution == "Amazon"

    - name: "Deploy clean Zabbix Agent 2 configuration"
      copy:
        dest: /etc/zabbix/zabbix_agent2.conf
        content: |
          PidFile=/run/zabbix/zabbix_agent2.pid
          LogFile=/var/log/zabbix/zabbix_agent2.log
          LogFileSize=0
          Server={{ zabbix_server_ip | regex_replace('\"', '') | regex_replace('\'', '') }}
          ServerActive={{ zabbix_server_ip | regex_replace('\"', '') | regex_replace('\'', '') }}
          Hostname={{ inventory_hostname }}
          HostMetadataItem=system.uname
          Include=/etc/zabbix/zabbix_agent2.d/*.conf
          ControlSocket=/run/zabbix/agent.sock
          Plugins.Docker.Endpoint=unix:///var/run/docker.sock
        owner: zabbix
        group: zabbix
        mode: '0644'
      notify: Restart Zabbix Agent

    - name: "Ensure Zabbix Agent 2 is running"
      service:
        name: zabbix-agent2
        state: started
        enabled: yes

    - name: "Show status"
      debug:
        msg: "✅ {{ inventory_hostname }} → Zabbix Server: {{ zabbix_server_ip }}"

  handlers:
    - name: Restart Zabbix Agent
      service:
        name: zabbix-agent2
        state: restarted
