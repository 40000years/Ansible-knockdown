---
- name: "Start kubectl port-forward for Grafana (background)"
  hosts: "{{ k3s_master_id }}"
  become: yes
  gather_facts: false
  vars:
    k3s_master_id: "CHANGE_ME"
    grafana_local_port: 3000

  tasks:
    - name: "Kill existing port-forward on port {{ grafana_local_port }} (if any)"
      shell: "pkill -f '[k]ubectl port-forward.*monitoring-grafana' || true"
      args:
        executable: /bin/bash

    - name: "Start kubectl port-forward for Grafana in background"
      shell: |
        nohup kubectl port-forward svc/monitoring-grafana {{ grafana_local_port }}:80 \
          -n monitoring --address 0.0.0.0 \
          > /tmp/grafana-pf.log 2>&1 &
        echo $!
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      args:
        executable: /bin/bash
      register: pf_pid

    - name: "Wait 3 seconds for port-forward to be ready"
      wait_for:
        port: "{{ grafana_local_port }}"
        host: "127.0.0.1"
        timeout: 15

    - name: "Show connection info"
      debug:
        msg:
          - "kubectl port-forward is running (PID: {{ pf_pid.stdout }})"
          - "Now run this on your Mac:"
          - ""
          - "  aws ssm start-session \\"
          - "    --target {{ inventory_hostname }} \\"
          - "    --document-name AWS-StartPortForwardingSession \\"
          - "    --parameters '{\"portNumber\":[\"{{ grafana_local_port }}\"],\"localPortNumber\":[\"{{ grafana_local_port }}\"]}'  "
          - ""
          - "Then open: http://localhost:{{ grafana_local_port }}"
