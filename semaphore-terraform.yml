---
- name: Execute Terraform via Semaphore
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Debug AWS Variables from Semaphore
      debug:
        msg: |
          Extra Var Access Key: "{{ AWS_ACCESS_KEY_ID | default('NOT_FOUND_IN_EXTRA_VARS') }}"
          Env Var Access Key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') | default('NOT_FOUND_IN_ENV', true) }}"

    - name: Ensure Terraform is initialized
      shell: |
        cd terraform
        terraform init -reconfigure -no-color
      environment:
        AWS_ACCESS_KEY_ID: "{{ AWS_ACCESS_KEY_ID | default(lookup('env', 'AWS_ACCESS_KEY_ID'), true) }}"
        AWS_SECRET_ACCESS_KEY: "{{ AWS_SECRET_ACCESS_KEY | default(lookup('env', 'AWS_SECRET_ACCESS_KEY'), true) }}"
        AWS_DEFAULT_REGION: "{{ AWS_DEFAULT_REGION | default(lookup('env', 'AWS_DEFAULT_REGION'), true) | default('ap-southeast-1', true) }}"

    - name: Ensure AWS CLI is installed (required for dashboard generation)
      shell: |
        if ! command -v aws &> /dev/null; then
          echo "AWS CLI not found. Downloading and installing locally..."
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          python3 -m zipfile -e awscliv2.zip .
          ./aws/install -i $(pwd)/aws-cli -b $(pwd)/bin
        fi
      args:
        executable: /bin/bash

    - name: Apply Terraform configuration
      shell: |
        export PATH="$(pwd)/bin:$PATH"
        cd terraform
        terraform apply -auto-approve -no-color
      environment:
        AWS_ACCESS_KEY_ID: "{{ AWS_ACCESS_KEY_ID | default(lookup('env', 'AWS_ACCESS_KEY_ID'), true) }}"
        AWS_SECRET_ACCESS_KEY: "{{ AWS_SECRET_ACCESS_KEY | default(lookup('env', 'AWS_SECRET_ACCESS_KEY'), true) }}"
        AWS_DEFAULT_REGION: "{{ AWS_DEFAULT_REGION | default(lookup('env', 'AWS_DEFAULT_REGION'), true) | default('ap-southeast-1', true) }}"
