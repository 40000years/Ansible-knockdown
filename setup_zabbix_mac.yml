---
# ==============================================================
# Deploy Zabbix Server บน Mac Local
#
# ใช้แทน setup_zabbix_azure.yml
#
# วิธีใช้ใน Semaphore:
#   - Inventory : inventory.local_mac.yml
#   - Playbook  : setup_zabbix_mac.yml
#   - Extra Variables:
#       mac_master_ip: "<IP-ที่-AWS-เข้าถึงได้>"
#
# หลังรันเสร็จ เข้าใช้งาน Zabbix ได้ทันที:
#   http://localhost:8088
#   Username: Admin / Password: zabbix (เปลี่ยนหลัง Login)
# ==============================================================

- name: "Deploy Zabbix Server on Mac Local"
  hosts: mac-master
  become: no
  gather_facts: true
  vars:
    mac_master_ip: "127.0.0.1"
    zabbix_db_password: "Zabbix@Secure123"
    zabbix_web_port: 8088

  tasks:
    - name: "Check if Docker is installed"
      shell: "docker --version"
      register: docker_check
      ignore_errors: true
      changed_when: false

    - name: "Fail if Docker is not installed"
      fail:
        msg: |
          ❌ Docker is not installed on this Mac!
          กรุณาติดตั้ง Docker Desktop for Mac ก่อน:
          https://docs.docker.com/desktop/install/mac-install/
      when: docker_check.rc != 0

    - name: "Ensure Docker service is running"
      shell: "docker info > /dev/null 2>&1"
      register: docker_running
      ignore_errors: true
      changed_when: false

    - name: "Fail if Docker is not running"
      fail:
        msg: |
          ❌ Docker is installed but not running!
          กรุณาเปิด Docker Desktop ก่อนรัน Playbook นี้
      when: docker_running.rc != 0

    - name: "Create Zabbix directory"
      file:
        path: /opt/zabbix
        state: directory
        mode: '0755'

    - name: "Stop existing Zabbix stack (if any)"
      shell: |
        cd /opt/zabbix
        docker compose down -v 2>/dev/null || true
      args:
        executable: /bin/bash

    - name: "Deploy Zabbix Docker Compose (MariaDB + correct charset)"
      copy:
        dest: /opt/zabbix/docker-compose.yml
        content: |
          version: '3.8'
          services:
            zabbix-db:
              image: mariadb:10.11
              container_name: zabbix-db
              restart: unless-stopped
              environment:
                MYSQL_ROOT_PASSWORD: "rootpass"
                MYSQL_DATABASE: "zabbix"
                MYSQL_USER: "zabbix"
                MYSQL_PASSWORD: "{{ zabbix_db_password }}"
              command: >
                --character-set-server=utf8mb4
                --collation-server=utf8mb4_bin
                --default-authentication-plugin=mysql_native_password
              volumes:
                - zabbix-db-data:/var/lib/mysql
              mem_limit: 512m

            zabbix-server:
              image: zabbix/zabbix-server-mysql:7.0-ubuntu-latest
              container_name: zabbix-server
              restart: unless-stopped
              ports:
                - "10051:10051"
              environment:
                DB_SERVER_HOST: zabbix-db
                MYSQL_DATABASE: "zabbix"
                MYSQL_USER: "zabbix"
                MYSQL_PASSWORD: "{{ zabbix_db_password }}"
                ZBX_JAVAGATEWAY_ENABLE: "false"
              depends_on:
                - zabbix-db
              mem_limit: 512m

            zabbix-web:
              image: zabbix/zabbix-web-nginx-mysql:7.0-ubuntu-latest
              container_name: zabbix-web
              restart: unless-stopped
              ports:
                - "{{ zabbix_web_port }}:8080"
              environment:
                ZBX_SERVER_HOST: zabbix-server
                DB_SERVER_HOST: zabbix-db
                MYSQL_DATABASE: "zabbix"
                MYSQL_USER: "zabbix"
                MYSQL_PASSWORD: "{{ zabbix_db_password }}"
                PHP_TZ: "Asia/Bangkok"
              depends_on:
                - zabbix-server
              mem_limit: 256m

          volumes:
            zabbix-db-data:

    - name: "Start Zabbix Stack"
      shell: |
        cd /opt/zabbix
        docker compose up -d
      args:
        executable: /bin/bash

    - name: "Wait for Zabbix DB to initialize (90 seconds)"
      pause:
        seconds: 90

    - name: "Check Zabbix Server logs"
      shell: "docker logs zabbix-server 2>&1 | tail -5"
      args:
        executable: /bin/bash
      register: zabbix_log
      changed_when: false

    - name: "Show Zabbix Access Information"
      debug:
        msg:
          - "============================================"
          - "  Zabbix Stack is deployed on Mac!"
          - "============================================"
          - "  Server Log (last 5 lines):"
          - "{{ zabbix_log.stdout }}"
          - "============================================"
          - "  เข้าใช้งาน Zabbix ได้ทันที (ไม่ต้อง SSH Tunnel):"
          - "  http://localhost:{{ zabbix_web_port }}"
          - "============================================"
          - "  Username: Admin"
          - "  Password: zabbix"
          - "  (เปลี่ยน Password ทันทีหลัง Login)"
          - "============================================"
          - "  NEXT STEP: รัน reconfigure_zabbix_agents.yml"
          - "  เพื่อให้ AWS Agents ชี้มาหา Mac Master"
          - "  Extra Variables:"
          - "    zabbix_server_ip: \"{{ mac_master_ip }}\""
          - "============================================"
