---
# ==============================================================
# Deploy Prometheus + Grafana บน Mac K3s Master (ไม่ต้องเข้าเครื่อง AWS)
#
# ใช้แทน deploy_prometheus_grafana_azure.yml
#
# วิธีใช้ใน Semaphore:
#   - Inventory : inventory.local_mac.yml
#   - Playbook  : deploy_prometheus_grafana_mac.yml
#   - Extra Variables:
#       mac_master_ip: "<IP-ที่-AWS-เข้าถึงได้>"
# ==============================================================

- name: "Deploy Prometheus + Grafana on Mac K3s Master"
  hosts: mac-master
  become: no
  gather_facts: true
  vars:
    mac_master_ip: "127.0.0.1"
    grafana_admin_password: "Admin@Monitor123"
    grafana_nodeport: 32000
    prometheus_nodeport: 32001

  tasks:
    - name: "Check if Helm is installed inside k3s-server container"
      shell: "docker exec k3s-server which helm"
      register: helm_check
      ignore_errors: true
      changed_when: false

    - name: "Install Helm (download on host, copy into k3s-server container)"
      shell: |
        set -e
        HELM_VERSION="v3.16.3"
        ARCH=$(uname -m)
        if [ "$ARCH" = "x86_64" ]; then ARCH="amd64"; elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then ARCH="arm64"; fi
        # Download บน Host (Semaphore Container ที่มี curl)
        curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-${ARCH}.tar.gz" -o /tmp/helm.tar.gz
        tar -zxf /tmp/helm.tar.gz -C /tmp
        # Copy binary เข้าไปใน k3s container
        docker exec k3s-server mkdir -p /usr/local/bin
        docker cp /tmp/linux-${ARCH}/helm k3s-server:/usr/local/bin/helm
        docker exec k3s-server chmod +x /usr/local/bin/helm
        # Clean up บน host
        rm -rf /tmp/helm.tar.gz /tmp/linux-${ARCH}
        # ยืนยันว่า helm ใช้งานได้ใน container
        docker exec k3s-server helm version
      args:
        executable: /bin/bash
      when: helm_check.rc != 0

    - name: "Add Prometheus Helm repo inside k3s-server"
      shell: |
        docker exec k3s-server sh -c '
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts 2>/dev/null || true
          helm repo update
        '
      args:
        executable: /bin/bash

    - name: "Wait for all K3s nodes to be Ready"
      shell: |
        docker exec k3s-server kubectl wait --for=condition=Ready nodes --all --timeout=180s
      register: nodes_ready
      until: nodes_ready.rc == 0
      retries: 10
      delay: 15
      args:
        executable: /bin/bash

    - name: "Deploy kube-prometheus-stack (Prometheus + Grafana)"
      shell: |
        docker exec k3s-server sh -c '
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          kubectl create namespace monitoring 2>/dev/null || true
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --set grafana.adminPassword="{{ grafana_admin_password }}" \
            --set grafana.service.type=NodePort \
            --set grafana.service.nodePort={{ grafana_nodeport }} \
            --set prometheus.service.type=NodePort \
            --set prometheus.service.nodePort={{ prometheus_nodeport }} \
            --set prometheus.prometheusSpec.scrapeInterval=15s \
            --set prometheus.prometheusSpec.evaluationInterval=15s \
            --set prometheus-node-exporter.enabled=false \
            --set prometheusOperator.admissionWebhooks.enabled=false \
            --set prometheusOperator.tls.enabled=false
        '
      args:
        executable: /bin/bash

    - name: "Show Monitoring Endpoints"
      debug:
        msg:
          - "============================================"
          - "  Monitoring Stack is LIVE on Mac K3s!"
          - "============================================"
          - "  Grafana   : http://{{ mac_master_ip }}:{{ grafana_nodeport }}"
          - "  Prometheus: http://{{ mac_master_ip }}:{{ prometheus_nodeport }}"
          - "  Username  : admin"
          - "  Password  : {{ grafana_admin_password }}"
          - "============================================"
          - "  AWS Agents สามารถยิง Remote Write มาที่:"
          - "  http://{{ mac_master_ip }}:{{ prometheus_nodeport }}"
          - "============================================"
